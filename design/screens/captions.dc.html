<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N-02 Auto captions – highlight</title>
<link rel="stylesheet" href="./precut.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</head>
<body>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-portrait"><div class="cap" style="top:72%">made it to <span style="color:#FFD43B">Lagos</span></div></div></div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Captions</div><button class="ib" aria-label="Captions style"><span class="ms">palette</span></button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="lst">
      <button class="li" style="min-height:52px"><span class="tc" style="font-size:12px;color:#9A9AA3;width:40px">0:00</span><div class="f1" style="font-size:15px">So this is day one of the trip</div></button>
      <button class="li" style="min-height:52px;background:#222226"><span class="tc" style="font-size:12px;color:#FF4D6D;width:40px">0:03</span><div class="f1" style="font-size:15px">we finally made it to Lagos</div><span class="ms s20">edit</span></button>
      <button class="li" style="min-height:52px"><span class="tc" style="font-size:12px;color:#9A9AA3;width:40px">0:06</span><div class="f1" style="font-size:15px">and the first stop is the beach</div></button>
      <button class="li" style="min-height:52px"><span class="tc" style="font-size:12px;color:#9A9AA3;width:40px">0:09</span><div class="f1" style="font-size:15px">the water is warmer than I thought</div></button>
    </div>
    <div class="pnl-b" style="padding-top:8px">
      <div style="display:flex;gap:8px;overflow:hidden"><button class="chip">Classic</button><button class="chip">Box</button><button class="chip">Bold</button><button class="chip on">Highlight</button><button class="chip">Pop</button><button class="chip">Minimal</button></div>
      <div class="sub">Only the sound is sent, after you agree. Music is left out.</div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</body>
</html>
