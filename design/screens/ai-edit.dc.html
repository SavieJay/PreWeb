<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N-01 AI edit – review</title>
<link rel="stylesheet" href="./precut.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</head>
<body>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-beach"><div class="cap" style="top:70%">Weekend in Lagos</div></div></div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Review the changes</div></div>
    <div style="padding:0 16px 6px;font-size:14px;line-height:20px">Cut to the beat of Afrobeat Sunrise, trimmed the slow parts and added a title. 0:31 in all.</div>
    <div style="padding:0 16px;display:flex;flex-direction:column">
      <div class="sect" style="padding:8px 0 2px">Step 1</div>
      <div class="swr"><span>Cut 4 clips to the beat</span><div class="sw on"></div></div>
      <div class="swr"><span>Cut 3.2 s of pauses and dull parts</span><div class="sw on"></div></div>
      <div class="sect" style="padding:8px 0 2px">Step 2</div>
      <div class="swr"><span>Added text “Weekend in Lagos”</span><div class="sw on"></div></div>
      <div class="swr"><span>Transition after clip 2</span><div class="sw"></div></div>
      <div class="swr"><span>Changed clip 3’s colour</span><div class="sw on"></div></div>
    </div>
    <div class="pnl-b" style="flex-direction:row;align-items:center;padding-top:10px">
      <button class="btn t">Discard</button>
      <span style="flex:1"></span>
      <button class="btn tn">Refine</button>
      <button class="btn f">Apply 4</button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</body>
</html>
