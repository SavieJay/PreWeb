<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N-03 Edit by transcript</title>
<link rel="stylesheet" href="./precut.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</head>
<body>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-cafe"></div></div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Edit by transcript</div><span class="chip" style="height:22px;font-size:10px;font-weight:700;background:#5C1426;color:#FF4D6D;margin-right:8px">PRO</span><button class="done"><span class="ms">check</span>Done</button></div>
    <div style="display:flex;gap:8px;padding:0 16px 8px"><button class="chip on">Remove filler words (6)</button><button class="chip">Remove silences (3)</button></div>
    <div style="padding:4px 16px 8px;font-size:16px;line-height:28px;color:#F2F2F5">
      So <s style="color:#6B6B74;background:#5C1426;border-radius:4px;padding:0 3px">um</s> this café opened last month, and <s style="color:#6B6B74;background:#5C1426;border-radius:4px;padding:0 3px">like</s> everyone keeps talking about the jollof. I ordered two plates, <s style="color:#6B6B74;background:#5C1426;border-radius:4px;padding:0 3px">you know</s>, one for the camera and one for me. <s style="color:#6B6B74;background:#5C1426;border-radius:4px;padding:0 3px">Uh</s> honestly it was worth the queue.
    </div>
    <div class="pnl-b" style="flex-direction:row;align-items:center">
      <button class="btn t">Preview</button>
      <span style="flex:1"></span>
      <button class="btn f">Apply 6 cuts</button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</body>
</html>
